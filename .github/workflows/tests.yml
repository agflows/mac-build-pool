name: Unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Python 3.9 (the existing Mac's interpreter) has no Ubuntu 26.04 build.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
